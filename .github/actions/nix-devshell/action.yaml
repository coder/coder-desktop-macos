name: "Setup Nix devshell"
description: |
  Installs Nix and builds the "ci" devshell from flake.nix. It does not change the environment of
  later steps. A step that needs the devshell's tools runs inside it with:

    shell: nix develop .#ci --command bash --noprofile --norc -eo pipefail {0}

  The bash options are the ones GitHub Actions uses for its default shell.
runs:
  using: "composite"
  steps:
    - name: Setup Nix
      uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703 # v30

    # Using the cache is somehow slower, so we're not using it for now.
    # - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6.1.3
    #   with:
    #     # restore and save a cache using this key
    #     primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
    #     # if there's no cache hit, restore a cache by this prefix
    #     restore-prefixes-first-match: nix-${{ runner.os }}-
    #     # collect garbage until Nix store size (in bytes) is at most this number
    #     # before trying to save a new cache
    #     # 1 GB = 1073741824 B
    #     gc-max-store-size-linux: 1073741824
    #     # do purge caches
    #     purge: true
    #     # purge all versions of the cache
    #     purge-prefixes: nix-${{ runner.os }}-
    #     # created more than this number of seconds ago relative to the start of the `Post Restore` phase
    #     purge-created: 0
    #     # except the version with the `primary-key`, if it exists
    #     purge-primary-key: never

    # Downloads what the devshell needs here, so that the time and the output of that are not
    # part of the first step that uses it.
    - name: Build devshell
      shell: bash
      run: nix develop .#ci --command true
