name: release

# Starts the build of Coder Desktop: the preview build on a push to main, a release when one is
# published. The jobs are in release-sign.yml. See RELEASING.md.

on:
  push:
    branches:
      - main
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Run in dry-run mode (upload as artifact instead of release asset)'
        required: true
        type: boolean
        default: false
permissions: {}

# Cancel in-progress runs for when multiple PRs get merged
# in quick succession. Ignore this for tag releases though.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'tags/')}}

jobs:
  release:
    # Runs main's copy of release-sign.yml, not this commit's. Google Cloud only lets that copy
    # sign, so a release tag chooses the commit to release, but not the steps that sign it.
    uses: coder/coder-desktop-macos/.github/workflows/release-sign.yml@main # zizmor: ignore[secrets-inherit,unpinned-uses]
    with:
      dryrun: ${{ inputs.dryrun || false }}
    # The environment secrets only reach the called jobs if the caller passes them.
    secrets: inherit
    permissions:
      contents: write # upload the release assets
      id-token: write # authenticate to Google Cloud
      attestations: write # record which run built the installer
