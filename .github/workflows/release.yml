name: release

on:
  push:
    branches:
      - main
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Run in dry-run mode (upload as artifact instead of release asset)'
        required: true
        type: boolean
        default: false
permissions: {}

# Cancel in-progress runs for when multiple PRs get merged
# in quick succession. Ignore this for tag releases though.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'tags/')}}

# The Developer ID Application key lives in Google Cloud KMS, which only Linux
# can reach (through the Cloud KMS PKCS#11 library), so the release alternates
# between macOS and Linux:
#   build (macOS)     unsigned app
#   sign-app (Linux)  sign the app with the Developer ID Application certificate
#   package (macOS)   unsigned installer around the signed app
#   sign-pkg (Linux)  sign the installer with the Developer ID Installer certificate, notarize, staple
#   publish (macOS)   Sparkle signature, release assets, appcast
# Only jobs in the "signing" environment get the signing identity, the Developer
# ID Installer key, the App Store Connect key and the Sparkle key.
jobs:
  build:
    name: Build Coder Desktop
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: ${{ github.repository_owner == 'coder' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Switch XCode Version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5.0"

      - name: Setup Nix
        uses: ./.github/actions/nix-devshell

      - name: Version
        id: version
        run: echo "version=$(./scripts/version.sh --short)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          APP_PROF: ${{ secrets.CODER_DESKTOP_APP_PROVISIONPROFILE_B64 }}
          EXT_PROF: ${{ secrets.CODER_DESKTOP_EXTENSION_PROVISIONPROFILE_B64 }}
        run: make release

      # A tar keeps the bundle's symlinks and permissions.
      - name: Archive unsigned app
        run: tar -C "$out" -cf "$RUNNER_TEMP/unsigned-app.tar" "Coder Desktop.app"

      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: ${{ runner.temp }}/unsigned-app.tar
          retention-days: 1

      - name: Upload dSYMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsyms
          path: ${{ github.workspace }}/outputs/out/coder-desktop-dsyms.zip
          retention-days: 1

  # Built in its own job so the signing jobs don't compile code with signing
  # credentials loaded. PKCS#11 support isn't in a published apple-codesign
  # release, so build it at a pinned revision, with the fix from
  # .github/rcodesign/pkcs11-single-init.patch.
  rcodesign:
    name: Build rcodesign
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'coder' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build rcodesign
        env:
          RCODESIGN_REV: 0ebbd2ef3b96d5adccc30b1cad4deea38cd735c4
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal stable
          rustup default stable
          src="$RUNNER_TEMP/apple-platform-rs"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/indygreg/apple-platform-rs.git "$RCODESIGN_REV"
          git -C "$src" checkout -q FETCH_HEAD
          git -C "$src" apply "$GITHUB_WORKSPACE/.github/rcodesign/pkcs11-single-init.patch"
          cargo install \
            --locked \
            --path "$src/apple-codesign" \
            --features pkcs11 \
            --bin rcodesign \
            --root "$RUNNER_TEMP/rcodesign-install"
          mkdir -p "$RUNNER_TEMP/rcodesign"
          cp "$RUNNER_TEMP/rcodesign-install/bin/rcodesign" "$RUNNER_TEMP/rcodesign/rcodesign"

      - name: Upload rcodesign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rcodesign
          path: ${{ runner.temp }}/rcodesign/rcodesign
          retention-days: 1

  sign-app:
    name: Sign app
    needs: [build, rcodesign]
    runs-on: ubuntu-24.04
    environment: signing
    permissions:
      contents: read
      # for the desktop-macos-signer identity
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Cloud KMS signing
        id: kms
        uses: ./.github/actions/kms-signing

      - name: Download unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-app
          path: ${{ runner.temp }}

      - name: Sign app
        env:
          PKCS11_LIBRARY: ${{ steps.kms.outputs.pkcs11-library }}
          KMS_PKCS11_CONFIG: ${{ steps.kms.outputs.kms-pkcs11-config }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.kms.outputs.credentials-file }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/app"
          mkdir -p "$work"
          tar -C "$work" -xf "$RUNNER_TEMP/unsigned-app.tar"
          ./scripts/sign.sh app "$work/Coder Desktop.app"
          tar -C "$work" -cf "$RUNNER_TEMP/signed-app.tar" "Coder Desktop.app"

      - name: Upload signed app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app
          path: ${{ runner.temp }}/signed-app.tar
          retention-days: 1

  package:
    name: Package installer
    needs: [build, sign-app]
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-app
          path: ${{ runner.temp }}

      # Check rcodesign's signature with Apple's own tools before shipping it.
      - name: Verify app signature
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/app"
          mkdir -p "$work"
          tar -C "$work" -xf "$RUNNER_TEMP/signed-app.tar"
          app="$work/Coder Desktop.app"
          team='anchor apple generic and certificate leaf[subject.OU] = "4399GN35BJ"'
          codesign --verify --deep --strict --verbose=2 "$app"
          for code in "$app" \
            "$app/Contents/MacOS/com.coder.Coder-Desktop.Helper" \
            "$app/Contents/Library/SystemExtensions/com.coder.Coder-Desktop.VPN.systemextension"; do
            codesign --verify --strict -R="$team" "$code"
            codesign --display --verbose=2 --entitlements - "$code"
          done

      - name: Package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ./scripts/package.sh \
            --app "$RUNNER_TEMP/app/Coder Desktop.app" \
            --version "$VERSION" \
            --output "$RUNNER_TEMP/Coder-Desktop.pkg"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-pkg
          path: ${{ runner.temp }}/Coder-Desktop.pkg
          retention-days: 1

  sign-pkg:
    name: Sign and notarize installer
    needs: [rcodesign, package]
    runs-on: ubuntu-24.04
    environment: signing
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download rcodesign
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rcodesign
          path: ${{ runner.temp }}/rcodesign

      - name: Install rcodesign
        run: sudo install -m 0755 "$RUNNER_TEMP/rcodesign/rcodesign" /usr/local/bin/rcodesign

      - name: Download unsigned installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-pkg
          path: ${{ runner.temp }}/pkg

      - name: Sign installer
        env:
          APPLE_INSTALLER_PKCS12_B64: ${{ secrets.APPLE_INSTALLER_PKCS12_B64 }}
          APPLE_INSTALLER_PKCS12_PASSWORD: ${{ secrets.APPLE_INSTALLER_PKCS12_PASSWORD }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          (
            umask 077
            printf '%s' "$APPLE_INSTALLER_PKCS12_B64" | base64 -d > "$dir/installer.p12"
            printf '%s' "$APPLE_INSTALLER_PKCS12_PASSWORD" > "$dir/installer.pw"
          )
          INSTALLER_P12_FILE="$dir/installer.p12" INSTALLER_P12_PASSWORD_FILE="$dir/installer.pw" \
            ./scripts/sign.sh pkg "$RUNNER_TEMP/pkg/Coder-Desktop.pkg"

      - name: Notarize installer
        env:
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          export AC_APIKEY_FILE="$RUNNER_TEMP/apple_apikey.p8"
          trap 'rm -f "$AC_APIKEY_FILE"' EXIT
          (umask 077 && printf '%s' "$AC_APIKEY_P8_BASE64" | base64 -d > "$AC_APIKEY_FILE")
          ./scripts/notarize.sh "$RUNNER_TEMP/pkg/Coder-Desktop.pkg"

      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-pkg
          path: ${{ runner.temp }}/pkg/Coder-Desktop.pkg
          retention-days: 1

  publish:
    name: Publish
    needs: [build, sign-pkg]
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    # Holds the Sparkle update signing key.
    environment: signing
    permissions:
      # To upload assets to the release
      contents: write
      # for GCP auth
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Switch XCode Version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5.0"

      - name: Setup Nix
        uses: ./.github/actions/nix-devshell

      - name: Download signed installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-pkg
          path: ${{ github.workspace }}/outputs/out

      - name: Download dSYMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsyms
          path: ${{ github.workspace }}/outputs/out

      - name: Verify installer
        run: |
          set -euo pipefail
          pkgutil --check-signature "$out/Coder-Desktop.pkg"
          xcrun stapler validate "$out/Coder-Desktop.pkg"
          spctl --assess --type install --verbose=2 "$out/Coder-Desktop.pkg"

      # sign_update comes from the Sparkle release the app links, checked
      # against the checksum in Sparkle's Package.swift that SwiftPM verifies.
      - name: Sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sparkle="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle"
          curl -fsSL -o "$sparkle/sparkle.zip" https://github.com/sparkle-project/Sparkle/releases/download/2.7.0/Sparkle-for-Swift-Package-Manager.zip
          echo "a1fb05c4fd6b73bc351f4d326e6171473b7a99b7f2bfa8f5f69f7281f66dc387  $sparkle/sparkle.zip" | shasum -a 256 -c
          unzip -q "$sparkle/sparkle.zip" bin/sign_update -d "$sparkle"
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle/bin/sign_update" "$out/Coder-Desktop.pkg" --ed-key-file -)
          echo "$signature" > "$out/Coder-Desktop.pkg.sig"

      # Upload as artifact in dry-run mode
      - name: Upload Build Artifact
        if: ${{ inputs.dryrun }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coder-desktop-build
          path: ${{ github.workspace }}/outputs/out
          retention-days: 7

      - name: Authenticate to Google Cloud
        if: ${{ !inputs.dryrun }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Setup GCloud SDK
        if: ${{ !inputs.dryrun }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Upload to release in non-dry-run mode
      - name: Upload Release Assets
        if: ${{ !inputs.dryrun }}
        run: gh release upload "$RELEASE_TAG" "$out"/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || 'preview' }}

      - name: Update Appcast
        if: ${{ !inputs.dryrun }}
        run: |
          gsutil cp "gs://releases.coder.com/coder-desktop/mac/appcast.xml" ./oldappcast.xml
          pushd scripts/update-appcast
          swift run update-appcast \
            -i ../../oldappcast.xml \
            -s "$out"/Coder-Desktop.pkg.sig \
            -v "$(../version.sh)" \
            -o ../../appcast.xml \
            -d "$VERSION_DESCRIPTION"
          popd
          gsutil -h "Cache-Control:no-cache,max-age=0" cp ./appcast.xml "gs://releases.coder.com/coder-desktop/mac/appcast.xml"
        env:
          VERSION_DESCRIPTION: ${{ (github.event_name == 'release' && github.event.release.body) || (github.event_name == 'push' && github.event.head_commit.message) || '' }}

  update-cask:
    name: Update homebrew-coder cask
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: ${{ github.repository_owner == 'coder' && github.event_name == 'release' }}
    needs: publish
    # Holds the coder-package-publisher App key; release tags only, approved by a release manager.
    environment: release-publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/nix-devshell

      - name: Generate coder-package-publisher App token
        id: publisher_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_PRIVATE_KEY }}
          owner: coder
          repositories: homebrew-coder
          permission-contents: write
          permission-pull-requests: write

      - name: Update homebrew-coder
        env:
          GH_TOKEN: ${{ steps.publisher_token.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSIGNEE: ${{ github.actor }}
        run: |
          git config --global user.email "ci@coder.com"
          git config --global user.name "Coder CI"
          gh auth setup-git

          ./scripts/update-cask.sh --version "$RELEASE_TAG" --assignee "$ASSIGNEE"
