name: release-sign

# Builds, signs, notarizes and publishes Coder Desktop. release.yml calls main's copy of this
# file. Google Cloud only lets that copy sign, so a release chooses the commit to build, but not
# the steps that sign it.
#
# A run with a version is a release: it only runs on main, for a commit on main, and creates the
# vX.Y.Z tag itself once it is approved. Any other run builds the head of main, as the preview
# build or as a dry run.
#
# The Developer ID keys live in Google Cloud KMS and cannot be exported.
# Xcode cannot sign with a key there, and the library that reaches it only
# exists for Linux, while building and packaging need macOS. So the jobs
# alternate:
#
#   build           macOS. Builds the app with code signing disabled.
#   rcodesign       Linux. Builds the signing tool, in a job with no credentials.
#   sign-app        Linux. Signs the app with the Developer ID Application key
#                   and notarizes it.
#   package         macOS. Builds the installer.
#   sign-installer  Linux. Signs the installer with the Developer ID
#                   Installer key and notarizes it.
#   sign-sparkle    macOS. Signs the installer for Sparkle.
#   publish         macOS. Publishes the installer.
#
# Each job records the SHA-256 of what it uploads as a job output, and the job that downloads
# it checks the file against that before using it.
#
# The three signing jobs run in the "signing" environment and the publish job
# in the "publish" environment. Neither environment has reviewers, so that
# preview builds from main need no approval. A release waits for one approval,
# in the approve job, before it is tagged, built or signed. See RELEASING.md.

on:
  workflow_call:
    inputs:
      dryrun:
        description: 'Run in dry-run mode (upload as artifact instead of release asset)'
        type: boolean
        default: false
      version:
        description: 'Version to release, e.g. v0.8.7. Empty for a preview build or a dry run'
        type: string
        default: ''
      commit:
        description: 'Full SHA of the commit on main to release. Required with a version'
        type: string
        default: ''
      release_notes:
        description: 'Release notes, also shown in the update prompt. Required with a version'
        type: string
        default: ''
permissions: {}

jobs:
  # The jobs below run the scripts and actions of the commit they build. So only a commit that
  # went through review on main may be built and signed: the head of main, or for a release the
  # commit input, once this job has checked it. Every later job checks out
  # `inputs.commit || github.sha` and runs only if this job passed.
  validate:
    name: Check the request
    runs-on: ubuntu-22.04
    if: ${{ github.repository_owner == 'coder' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the request
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DRYRUN: ${{ inputs.dryrun }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # Also stops a run started from a tag or from another branch.
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || fail "This workflow only runs on main, not on $GITHUB_REF."

          if [[ -z "$VERSION" ]]; then
            [[ -z "$COMMIT" && -z "$RELEASE_NOTES" ]] || fail "commit and release_notes are only for a release: give a version too."
            exit 0
          fi

          [[ "$DRYRUN" != "true" ]] || fail "A release cannot be a dry run: leave version empty for a dry run."
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must look like v1.2.3, got '$VERSION'."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "commit must be a full 40-character SHA, got '$COMMIT'."
          [[ -n "$RELEASE_NOTES" ]] || fail "A release needs release notes."
          git merge-base --is-ancestor "$COMMIT" "$GITHUB_SHA" || fail "$COMMIT is not on main."

  # A release is tagged only after a reviewer of the "release-approval" environment approves
  # this job, and it is built and signed only once it is tagged. The job runs for releases only.
  #
  # Only the coder-release-publisher App may create a tag (ruleset "Release tags (App only)").
  # Its key is in Cloud KMS, and in this repository only this job (main's copy of this file, in
  # release-approval) may sign with it. So the tag is created here, at a commit on main, and
  # nobody can push one beforehand.
  approve:
    name: Approve and tag the release
    needs: validate
    runs-on: ubuntu-22.04
    if: ${{ github.repository_owner == 'coder' && inputs.version != '' }}
    environment: release-approval
    permissions:
      contents: read
      id-token: write # Cloud KMS signs the App's JWT
    steps:
      # For the tags and the history of main. Nothing from the tree runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Here and not in the validate job, because the tags can change while the run waits for
      # approval.
      - name: Check the tag
        id: check
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          # Checked by the validate job too, and again in the job that may tag.
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version must look like v1.2.3, got '$VERSION'."
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "commit must be a full 40-character SHA, got '$COMMIT'."
          git merge-base --is-ancestor "$COMMIT" "$GITHUB_SHA" || fail "$COMMIT is not on main."

          # A re-run finds the tag that the first attempt created.
          if existing="$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}")"; then
            [[ "$existing" == "$COMMIT" ]] || fail "Tag $VERSION already exists at $existing, not at $COMMIT."
            echo "Tag $VERSION already exists at $COMMIT."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # scripts/version.sh reads the version from the tag on the commit, so each release
          # needs a commit of its own.
          released="$(git tag --points-at "$COMMIT" --list 'v*' | paste -sd ' ' -)"
          [[ -z "$released" ]] || fail "$COMMIT was already released as $released. Release a newer commit."

          # Versions only go up, and a release never comes from before the last one.
          tags="$(git tag --list 'v*' --sort=-version:refname)"
          latest="$(grep -E -m 1 '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" || true)"
          if [[ -n "$latest" ]]; then
            printf '%s\n' "$latest" "$VERSION" | sort -V -C || fail "$VERSION is not newer than $latest, the latest release."
            git merge-base --is-ancestor "$latest" "$COMMIT" || fail "$COMMIT is older than the commit released as $latest."
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"

      # The App can also write to coder/coder, so the token is asked for this repository only.
      - name: Generate release App token
        id: app_token
        if: ${{ steps.check.outputs.create == 'true' }}
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_RELEASE_PUBLISHER_APP_ID }}
          kms-key: ${{ secrets.CODER_RELEASE_PUBLISHER_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: coder-desktop-macos
          permissions: |
            contents: write
            workflows: write

      # An annotated tag, through the API: nothing is pushed from this job's checkout.
      - name: Create the tag
        if: ${{ steps.check.outputs.create == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$VERSION" -f message="Release $VERSION" -f object="$COMMIT" -f type=commit \
            --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$tag_object" >/dev/null
          echo "Created tag $VERSION at $COMMIT."

  # The approve job is skipped unless this is a release. A job is skipped by default when any
  # job before it was, however far back, so this job and every job after it state what they
  # need instead.
  build:
    name: Build Coder Desktop
    needs: [validate, approve]
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: >-
      ${{ !cancelled() && github.repository_owner == 'coder' &&
      needs.validate.result == 'success' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    permissions:
      contents: read
    env:
      # See the test job in ci.yml.
      DEPOT_XCODE_CACHE_ENABLED: 0
    outputs:
      app-sha256: ${{ steps.checksums.outputs.app }}
      dsyms-sha256: ${{ steps.checksums.outputs.dsyms }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The build takes its version from the tag, so stop here if that is not the one asked for.
      - name: Check the version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tagged="v$(./scripts/version.sh)"
          if [[ "$tagged" != "$VERSION" ]]; then
            echo "::error::The tags give this commit the version $tagged, not $VERSION."
            exit 1
          fi

      - name: Switch XCode Version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5.0"

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Build
        run: ./scripts/build.sh build/release

      - name: Record checksums
        id: checksums
        run: |
          set -euo pipefail
          app="$(shasum -a 256 build/release/coder-desktop-unsigned.tar | cut -d ' ' -f 1)"
          dsyms="$(shasum -a 256 build/release/coder-desktop-dsyms.zip | cut -d ' ' -f 1)"
          {
            echo "app=$app"
            echo "dsyms=$dsyms"
          } >> "$GITHUB_OUTPUT"

      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: build/release/coder-desktop-unsigned.tar
          retention-days: 3

      - name: Upload debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsyms
          path: build/release/coder-desktop-dsyms.zip
          retention-days: 3

  # Builds the signing tool in a job that holds no credentials, so that nothing downloaded for
  # the build runs next to the signing identity or the notarization key. It is built in every
  # run and handed to the signing jobs as an artifact, not cached: any workflow run on a branch
  # can write that branch's caches.
  rcodesign:
    name: Build rcodesign
    needs: validate
    runs-on: ubuntu-22.04
    if: ${{ github.repository_owner == 'coder' }}
    permissions: {}
    outputs:
      sha256: ${{ steps.rcodesign.outputs.sha256 }}
    steps:
      - name: Build rcodesign
        id: rcodesign
        uses: coder/setup-apple-signing-action/rcodesign@7901d28b3975e01adede2dd2044dde8280ce605a # main 2026-11-19

      - name: Upload rcodesign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rcodesign
          path: ${{ steps.rcodesign.outputs.path }}
          retention-days: 1

  # Needs the approve job itself and not only the build that waited for it, so that nothing is
  # signed for a release without the approval, whatever happens to the build job.
  sign-app:
    name: Sign and notarize the app
    needs: [build, rcodesign, approve]
    runs-on: ubuntu-22.04
    if: >-
      ${{ !cancelled() && github.repository_owner == 'coder' &&
      needs.build.result == 'success' && needs.rcodesign.result == 'success' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    # Holds the signing identity. The Google Cloud workload identity provider
    # only exchanges tokens for main's copy of this file, from this environment,
    # which only main may use.
    environment: signing
    permissions:
      contents: read
      # To authenticate to Google Cloud
      id-token: write
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      # Tools first, before any credential is written to disk. rcodesign comes from the
      # rcodesign job of this run.
      - name: Download rcodesign
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rcodesign
          path: ${{ runner.temp }}/rcodesign

      - name: Check rcodesign
        env:
          SHA256: ${{ needs.rcodesign.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum from the rcodesign job."; exit 1; }
          sha256sum -c <<<"$SHA256  $RUNNER_TEMP/rcodesign/rcodesign"

      - name: Install rcodesign
        run: |
          set -euo pipefail
          sudo install -m 0755 "$RUNNER_TEMP/rcodesign/rcodesign" /usr/bin/rcodesign
          rcodesign --version

      # jsign signs the Windows programs in the agents archive. It runs on the Java of the
      # runner image.
      - name: Setup jsign
        run: |
          set -euo pipefail
          java -version
          wget -q -O /tmp/jsign-6.0.jar https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar
          echo "05ca18d4ab7b8c2183289b5378d32860f0ea0f3bdab1f1b8cae5894fb225fa8a  /tmp/jsign-6.0.jar" | sha256sum -c

      - name: Set up Apple signing
        id: apple_signing
        uses: coder/setup-apple-signing-action@7901d28b3975e01adede2dd2044dde8280ce605a # main 2026-11-19
        with:
          certificate-pem: ${{ secrets.AC_CERTIFICATE_PEM }}
          key-ring: ${{ secrets.AC_KMS_KEY_RING }}

      - name: Setup profiles and notarization key
        env:
          AC_APP_PROVISIONPROFILE_B64: ${{ secrets.AC_APP_PROVISIONPROFILE_B64 }}
          AC_EXT_PROVISIONPROFILE_B64: ${{ secrets.AC_EXT_PROVISIONPROFILE_B64 }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          touch /tmp/{app.provisionprofile,ext.provisionprofile,apple_apikey.p8,apple_apikey.json}
          chmod 600 /tmp/{app.provisionprofile,ext.provisionprofile,apple_apikey.p8,apple_apikey.json}

          # Decodes one secret and, if it is not base64, says which one.
          # Whitespace is dropped first: base64 rejects the stray line break
          # or space that a pasted value often carries.
          decode() {
            if ! tr -d '[:space:]' <<<"${!1}" | base64 -d > "$2"; then
              echo "::error::The $1 secret is not valid base64. It must be the base64 of the file, not the file itself."
              exit 1
            fi
          }
          decode AC_APP_PROVISIONPROFILE_B64 /tmp/app.provisionprofile
          decode AC_EXT_PROVISIONPROFILE_B64 /tmp/ext.provisionprofile
          decode AC_APIKEY_P8_BASE64 /tmp/apple_apikey.p8

      # Before anything slow, so that a wrong secret fails in seconds and says
      # why.
      - name: Check notarization key
        run: |
          set -euo pipefail
          if ! openssl pkey -in /tmp/apple_apikey.p8 -noout; then
            echo "::error::The AC_APIKEY_P8_BASE64 secret does not decode to a private key. It must be the base64 of the AuthKey .p8 file."
            exit 1
          fi

      - name: Setup and check Authenticode certificate
        env:
          EV_SIGNING_CERT: ${{ secrets.EV_SIGNING_CERT }}
          EV_KEYSTORE: ${{ secrets.EV_KEYSTORE }}
          EV_KEY: ${{ secrets.EV_KEY }}
          EV_TSA_URL: ${{ secrets.EV_TSA_URL }}
        run: |
          set -euo pipefail
          for name in EV_SIGNING_CERT EV_KEYSTORE EV_KEY EV_TSA_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is not set in the signing environment."
              exit 1
            fi
          done
          touch /tmp/ev_cert.pem
          chmod 600 /tmp/ev_cert.pem
          echo "$EV_SIGNING_CERT" > /tmp/ev_cert.pem
          if ! openssl x509 -in /tmp/ev_cert.pem -noout -subject -serial -enddate; then
            echo "::error::The EV_SIGNING_CERT secret is not a PEM certificate."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: gcloud_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.SIGNING_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.SIGNING_SERVICE_ACCOUNT }}
          # The access token is for jsign.
          token_format: "access_token"

      - name: Download unsigned app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-app
          path: build/unsigned

      - name: Check unsigned app
        env:
          SHA256: ${{ needs.build.outputs.app-sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum from the build job."; exit 1; }
          sha256sum -c <<<"$SHA256  build/unsigned/coder-desktop-unsigned.tar"

      - name: Sign
        env:
          APP_PROF_PATH: /tmp/app.provisionprofile
          EXT_PROF_PATH: /tmp/ext.provisionprofile
          AC_CERTIFICATE_FILE: ${{ steps.apple_signing.outputs.certificate-file }}
          AC_PKCS11_LIBRARY: ${{ steps.apple_signing.outputs.pkcs11-library }}
          AC_PKCS11_KEY_LABEL: ${{ secrets.AC_KMS_KEY }}
          KMS_PKCS11_CONFIG: ${{ steps.apple_signing.outputs.pkcs11-config }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud_auth.outputs.credentials_file_path }}
          JSIGN_PATH: /tmp/jsign-6.0.jar
          EV_KEYSTORE: ${{ secrets.EV_KEYSTORE }}
          EV_KEY: ${{ secrets.EV_KEY }}
          EV_CERTIFICATE_PATH: /tmp/ev_cert.pem
          EV_TSA_URL: ${{ secrets.EV_TSA_URL }}
          GCLOUD_ACCESS_TOKEN: ${{ steps.gcloud_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p build/app
          tar -C build/app -xf build/unsigned/coder-desktop-unsigned.tar
          ./scripts/signing/sign-app.sh "build/app/Coder Desktop.app"

      - name: Notarize and staple
        env:
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
        run: |
          set -euo pipefail
          rcodesign encode-app-store-connect-api-key \
            "$AC_APIKEY_ISSUER_ID" \
            "$AC_APIKEY_ID" \
            /tmp/apple_apikey.p8 \
            > /tmp/apple_apikey.json
          rcodesign notary-submit \
            --api-key-path /tmp/apple_apikey.json \
            --staple \
            "build/app/Coder Desktop.app"
          tar -C build/app -cf build/coder-desktop-signed.tar "Coder Desktop.app"

      - name: Record checksum
        id: checksum
        run: |
          set -euo pipefail
          sha256="$(sha256sum build/coder-desktop-signed.tar | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload signed app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app
          path: build/coder-desktop-signed.tar
          retention-days: 3

      - name: Delete certificate, profiles and notarization key
        if: always()
        run: |
          rm -f /tmp/{ev_cert.pem,app.provisionprofile,ext.provisionprofile,apple_apikey.p8,apple_apikey.json}
          rm -rf "$RUNNER_TEMP/apple-signing"

  package:
    name: Build the installer
    needs: sign-app
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: ${{ !cancelled() && github.repository_owner == 'coder' && needs.sign-app.result == 'success' }}
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Download signed app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-app
          path: build/signed

      - name: Check signed app
        env:
          SHA256: ${{ needs.sign-app.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum from the sign-app job."; exit 1; }
          shasum -a 256 -c <<<"$SHA256  build/signed/coder-desktop-signed.tar"

      # The installer comes out unsigned. The sign-installer job signs it.
      - name: Build the installer
        run: |
          set -euo pipefail
          mkdir -p build/app build/package
          tar -C build/app -xf build/signed/coder-desktop-signed.tar
          app="build/app/Coder Desktop.app"
          version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")"
          pkgbuild --component "$app" \
            --scripts pkgbuild/scripts/ \
            --identifier "com.coder.Coder-Desktop" \
            --version "$version" \
            --install-location "/Applications/" \
            build/package/Coder-Desktop.pkg

      - name: Record checksum
        id: checksum
        run: |
          set -euo pipefail
          sha256="$(shasum -a 256 build/package/Coder-Desktop.pkg | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: build/package/Coder-Desktop.pkg
          retention-days: 3

  sign-installer:
    name: Sign and notarize the installer
    needs: [package, rcodesign]
    runs-on: ubuntu-22.04
    if: >-
      ${{ !cancelled() && github.repository_owner == 'coder' &&
      needs.package.result == 'success' && needs.rcodesign.result == 'success' }}
    # See the sign-app job.
    environment: signing
    permissions:
      contents: read
      # To authenticate to Google Cloud
      id-token: write
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      # Tools first, as in the sign-app job.
      - name: Download rcodesign
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rcodesign
          path: ${{ runner.temp }}/rcodesign

      - name: Check rcodesign
        env:
          SHA256: ${{ needs.rcodesign.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum from the rcodesign job."; exit 1; }
          sha256sum -c <<<"$SHA256  $RUNNER_TEMP/rcodesign/rcodesign"

      - name: Install rcodesign
        run: |
          set -euo pipefail
          sudo install -m 0755 "$RUNNER_TEMP/rcodesign/rcodesign" /usr/bin/rcodesign
          rcodesign --version

      - name: Set up Apple signing
        id: apple_signing
        uses: coder/setup-apple-signing-action@7901d28b3975e01adede2dd2044dde8280ce605a # main 2026-11-19
        with:
          certificate-pem: ${{ secrets.AC_INSTALLER_CERTIFICATE_PEM }}
          key-ring: ${{ secrets.AC_KMS_KEY_RING }}

      - name: Check installer certificate and setup notarization key
        env:
          AC_CERTIFICATE_FILE: ${{ steps.apple_signing.outputs.certificate-file }}
          AC_INSTALLER_KMS_KEY: ${{ secrets.AC_INSTALLER_KMS_KEY }}
          AC_APIKEY_P8_BASE64: ${{ secrets.AC_APIKEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$AC_INSTALLER_KMS_KEY" ]]; then
            echo "::error::The AC_INSTALLER_KMS_KEY secret is not set in the signing environment."
            exit 1
          fi
          touch /tmp/{apple_apikey.p8,apple_apikey.json}
          chmod 600 /tmp/{apple_apikey.p8,apple_apikey.json}
          if ! tr -d '[:space:]' <<<"$AC_APIKEY_P8_BASE64" | base64 -d > /tmp/apple_apikey.p8; then
            echo "::error::The AC_APIKEY_P8_BASE64 secret is not valid base64."
            exit 1
          fi
          subject="$(openssl x509 -in "$AC_CERTIFICATE_FILE" -noout -subject)"
          if [[ "$subject" != *"Developer ID Installer"* ]]; then
            echo "::error::AC_INSTALLER_CERTIFICATE_PEM is not a Developer ID Installer certificate. An installer cannot be signed with the application certificate."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: gcloud_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.SIGNING_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.SIGNING_SERVICE_ACCOUNT }}

      - name: Download unsigned installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer
          path: build/package

      - name: Check unsigned installer
        env:
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum from the package job."; exit 1; }
          sha256sum -c <<<"$SHA256  build/package/Coder-Desktop.pkg"

      - name: Sign
        env:
          AC_CERTIFICATE_FILE: ${{ steps.apple_signing.outputs.certificate-file }}
          AC_PKCS11_LIBRARY: ${{ steps.apple_signing.outputs.pkcs11-library }}
          AC_PKCS11_KEY_LABEL: ${{ secrets.AC_INSTALLER_KMS_KEY }}
          KMS_PKCS11_CONFIG: ${{ steps.apple_signing.outputs.pkcs11-config }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud_auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          mkdir -p build/out
          ./scripts/signing/sign-installer.sh build/package/Coder-Desktop.pkg build/out/Coder-Desktop.pkg

      - name: Notarize and staple
        env:
          AC_APIKEY_ISSUER_ID: ${{ secrets.AC_APIKEY_ISSUER_ID }}
          AC_APIKEY_ID: ${{ secrets.AC_APIKEY_ID }}
        run: |
          set -euo pipefail
          rcodesign encode-app-store-connect-api-key \
            "$AC_APIKEY_ISSUER_ID" \
            "$AC_APIKEY_ID" \
            /tmp/apple_apikey.p8 \
            > /tmp/apple_apikey.json
          rcodesign notary-submit \
            --api-key-path /tmp/apple_apikey.json \
            --staple \
            build/out/Coder-Desktop.pkg

      - name: Record checksum
        id: checksum
        run: |
          set -euo pipefail
          sha256="$(sha256sum build/out/Coder-Desktop.pkg | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: build/out/Coder-Desktop.pkg
          retention-days: 3

      - name: Delete certificate and notarization key
        if: always()
        run: |
          rm -f /tmp/{apple_apikey.p8,apple_apikey.json}
          rm -rf "$RUNNER_TEMP/apple-signing"

  # Sparkle, the app's updater, only accepts an installer whose Ed25519 signature verifies
  # against the public key built into the app. The signature covers the file as it is after
  # notarization, and Sparkle's signing tool only runs on macOS.
  #
  # The job does nothing else, so that the Sparkle key is only ever next to that one tool.
  sign-sparkle:
    name: Sign the installer for Sparkle
    needs: sign-installer
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: ${{ !cancelled() && github.repository_owner == 'coder' && needs.sign-installer.result == 'success' }}
    # See the sign-app job.
    environment: signing
    permissions: {}
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: build/out

      - name: Check installer
        env:
          SHA256: ${{ needs.sign-installer.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No checksum from the sign-installer job."; exit 1; }
          shasum -a 256 -c <<<"$SHA256  build/out/Coder-Desktop.pkg"

      # The tool comes from the Sparkle release the app is built with.
      - name: Install Sparkle's signing tool
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/sign_update

      - name: Sign for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is not set in the signing environment."
            exit 1
          fi
          # The key goes in on standard input.
          echo "$SPARKLE_PRIVATE_KEY" |
            "$RUNNER_TEMP/sparkle/bin/sign_update" build/out/Coder-Desktop.pkg --ed-key-file - \
              > build/out/Coder-Desktop.pkg.sig
          cat build/out/Coder-Desktop.pkg.sig

      - name: Record checksum
        id: checksum
        run: |
          set -euo pipefail
          sha256="$(shasum -a 256 build/out/Coder-Desktop.pkg.sig | cut -d ' ' -f 1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Sparkle signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sparkle-signature
          path: build/out/Coder-Desktop.pkg.sig
          retention-days: 3

  # Holds no signing key, so it is outside the signing environment: the appcast tool's
  # dependencies and the gcloud action run here. Its own environment holds the Google Cloud
  # identity that may write to the releases bucket.
  publish:
    name: Publish
    needs: [build, sign-installer, sign-sparkle]
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: >-
      ${{ !cancelled() && github.repository_owner == 'coder' &&
      needs.build.result == 'success' && needs.sign-installer.result == 'success' &&
      needs.sign-sparkle.result == 'success' }}
    environment: publish
    permissions:
      # To upload assets to the release
      contents: write
      # for GCP auth
      id-token: write
    steps:
      # With tags, for scripts/version.sh in the appcast step.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Switch XCode Version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5.0"

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: build/out

      - name: Download Sparkle signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sparkle-signature
          path: build/out

      - name: Download debug symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsyms
          path: build/out

      - name: Check downloads
        env:
          INSTALLER_SHA256: ${{ needs.sign-installer.outputs.sha256 }}
          SIGNATURE_SHA256: ${{ needs.sign-sparkle.outputs.sha256 }}
          DSYMS_SHA256: ${{ needs.build.outputs.dsyms-sha256 }}
        run: |
          set -euo pipefail
          for sha256 in "$INSTALLER_SHA256" "$SIGNATURE_SHA256" "$DSYMS_SHA256"; do
            [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::A checksum from an earlier job is missing."; exit 1; }
          done
          shasum -a 256 -c <<EOF
          $INSTALLER_SHA256  build/out/Coder-Desktop.pkg
          $SIGNATURE_SHA256  build/out/Coder-Desktop.pkg.sig
          $DSYMS_SHA256  build/out/coder-desktop-dsyms.zip
          EOF

      # Upload as artifact in dry-run mode
      - name: Upload Build Artifact
        if: ${{ inputs.dryrun }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coder-desktop-build
          path: build/out
          retention-days: 7

      - name: Authenticate to Google Cloud
        if: ${{ !inputs.dryrun }}
        id: gcloud_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Setup GCloud SDK
        if: ${{ !inputs.dryrun }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The preview build replaces the assets of the "preview" release. GitHub can lock the assets
      # of published releases, but only of those published after that is turned on, and this one
      # is older. Do not delete and recreate it: a new one would be locked like any other.
      - name: Upload Preview Assets
        if: ${{ !inputs.dryrun && inputs.version == '' }}
        run: gh release upload preview build/out/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The approve job created the tag, and --verify-tag stops gh from creating one here. gh
      # creates the release as a draft, uploads the assets and only then publishes it.
      #
      # A published release is final, and nothing here uploads to one. A re-run of this job
      # finds the release that its first attempt published, and only checks that it holds the
      # files of this run. A second build of a published version is refused.
      - name: Create Release
        if: ${{ !inputs.dryrun && inputs.version != '' }}
        run: |
          set -euo pipefail
          if ! draft="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release create "$VERSION" build/out/* --verify-tag --title "$VERSION" --notes "$RELEASE_NOTES"
            exit 0
          fi

          # An earlier attempt stopped between creating the draft and publishing it.
          if [[ "$draft" == "true" ]]; then
            gh release upload "$VERSION" build/out/* --clobber
            gh release edit "$VERSION" --draft=false --verify-tag --title "$VERSION" --notes "$RELEASE_NOTES"
            exit 0
          fi

          published="$(gh release view "$VERSION" --json assets --jq '.assets[] | "\(.digest)  \(.name)"' | LC_ALL=C sort)"
          built="$(cd build/out && for f in *; do echo "sha256:$(shasum -a 256 "$f" | cut -d ' ' -f 1)  $f"; done | LC_ALL=C sort)"
          if [[ "$published" != "$built" ]]; then
            echo "::error::$VERSION is already published, with other files than this run built. A published version cannot be built again: re-run the failed jobs of the run that published it, or release the next version."
            exit 1
          fi
          echo "$VERSION is already published, with the files of this run."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}

      - name: Update Appcast
        if: ${{ !inputs.dryrun }}
        run: |
          gsutil cp "gs://releases.coder.com/coder-desktop/mac/appcast.xml" ./oldappcast.xml
          pushd scripts/update-appcast
          swift run --disable-automatic-resolution update-appcast \
            -i ../../oldappcast.xml \
            -s ../../build/out/Coder-Desktop.pkg.sig \
            -v "$(../version.sh)" \
            -o ../../appcast.xml \
            -d "$VERSION_DESCRIPTION"
          popd
          gsutil -h "Cache-Control:no-cache,max-age=0" cp ./appcast.xml "gs://releases.coder.com/coder-desktop/mac/appcast.xml"
        env:
          VERSION_DESCRIPTION: ${{ inputs.release_notes || (github.event_name == 'push' && github.event.head_commit.message) || '' }}

  update-cask:
    name: Update homebrew-coder cask
    runs-on: ${{ github.repository_owner == 'coder' && 'depot-macos-26' || 'macos-26'}}
    if: >-
      ${{ !cancelled() && github.repository_owner == 'coder' && inputs.version != '' &&
      needs.publish.result == 'success' }}
    needs: publish
    # Only this job (main's release-sign.yml, in release-publish, approved by a release manager)
    # may sign with the coder-package-publisher App's Cloud KMS key.
    environment: release-publish
    permissions:
      id-token: write # Cloud KMS signs the App's JWT
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Generate coder-package-publisher App token
        id: publisher_token
        uses: coder/github-app-token-action@00eaec58ee1bfea9c8b48655b7ab7470b07739e5 # main 2026-11-17
        with:
          client-id: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_ID }}
          kms-key: ${{ secrets.CODER_PACKAGE_PUBLISHER_APP_KMS_KEY }}
          workload-identity-provider: ${{ secrets.APP_KEYS_WORKLOAD_ID_PROVIDER }}
          owner: coder
          repositories: homebrew-coder
          permissions: |
            contents: write
            pull_requests: write

      - name: Update homebrew-coder
        env:
          GH_TOKEN: ${{ steps.publisher_token.outputs.token }}
          RELEASE_TAG: ${{ inputs.version }}
          ASSIGNEE: ${{ github.actor }}
        run: |
          git config --global user.email "ci@coder.com"
          git config --global user.name "Coder CI"
          gh auth setup-git

          ./scripts/update-cask.sh --version "$RELEASE_TAG" --assignee "$ASSIGNEE"
